name: Build and attach DotClaudeAnalyzer to release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm build.spec

      - name: Rename exe
        run: Move-Item dist/DotClaude-Analyzer.exe DotClaude-Analyzer-${{ github.event.release.tag_name }}-win64.exe

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: DotClaude-Analyzer-${{ github.event.release.tag_name }}-win64.exe
